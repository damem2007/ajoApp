services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ajo
      POSTGRES_USER: ajo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajo-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajo -d ajo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ajo-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ajo-redis:/data

  migrate:
    build: .
    env_file: .env
    environment: &runtime-env
      DATABASE_URL: postgresql://ajo:${POSTGRES_PASSWORD:-ajo-dev-only}@postgres:5432/ajo
      AJO_DATABASE_MODE: postgres
      AJO_REDIS_URL: redis://redis:6379/0
      AJO_API_HOST: 0.0.0.0
      AJO_DATA_DIR: /data/secrets
      AJO_FALLBACK_DATABASE_URL: sqlite:////data/fallback.db
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ajo-data:/data

  ajo-api:
    build: .
    env_file: .env
    environment: *runtime-env
    command: ["python", "-m", "app.serve"]
    ports:
      - "${AJO_API_PORT:-9020}:9020"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ajo-data:/data

  ajo-outbox-dispatcher:
    build: .
    env_file: .env
    environment: *runtime-env
    command: ["python", "-m", "app.platform.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ajo-data:/data

  ajo-payment-worker:
    build: .
    env_file: .env
    environment: *runtime-env
    command: ["python", "-m", "app.platform.workers", "payment"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ajo-data:/data

  ajo-notification-worker:
    build: .
    env_file: .env
    environment: *runtime-env
    command: ["python", "-m", "app.platform.workers", "notification"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ajo-data:/data

  ajo-reconciliation-worker:
    build: .
    env_file: .env
    environment: *runtime-env
    command: ["python", "-m", "app.platform.workers", "reconciliation"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ajo-data:/data

  ajo-scheduler:
    build: .
    env_file: .env
    environment: *runtime-env
    command: ["python", "-m", "app.platform.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ajo-data:/data

volumes:
  ajo-postgres:
  ajo-redis:
  ajo-data:
